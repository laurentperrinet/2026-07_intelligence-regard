summary: "Ouvrez les yeux : le monde semble s'étendre devant vous, net et coloré jusque dans ses moindres recoins. Pourtant, l’image captée par la rétine n’est pas uniforme : ultra-précise au centre, plus floue et moins riche en couleurs en périphérie. Comprendre ce décalage aide à mieux diagnostiquer certaines pathologies visuelles et inspire des algorithmes d’intelligence artificielle plus sobres énergétiquement."
